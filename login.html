<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2A3042">
    <title>Admin Login - Vinixx</title>
    <link rel="icon" href="assets/img/vinixx-icon.png">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>

<body class="login-page">
    <main class="login-card">
        <img src="assets/img/vinixx-logo.png" alt="Vinixx">
        <h1>Admin Login</h1>
        <p class="sub">Sign in with your registered mobile number</p>
        <form id="login-phone-form">
            <label for="mobile">Mobile Number</label>
            <input id="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"
                value="8160348894" required>
            <button class="btn" type="submit">Send OTP</button>
        </form>
        <form id="login-otp-form" hidden>
            <p class="sub" style="margin-bottom:14px">Enter the 6-digit code sent to <strong id="sent-to"></strong></p>
            <div class="otp-row"><input inputmode="numeric" maxlength="1" value="1"><input inputmode="numeric"
                    maxlength="1" value="2"><input inputmode="numeric" maxlength="1" value="3"><input
                    inputmode="numeric" maxlength="1" value="4"><input inputmode="numeric" maxlength="1"
                    value="5"><input inputmode="numeric" maxlength="1" value="6"></div>
            <button class="btn" type="submit">Verify &amp; Login</button>
            <button class="btn sec" type="button" id="change-number">Change number</button>
        </form>
        <p class="demo-note">Demo only – any 10-digit number and OTP works.</p>
    </main>
    <script src="assets/js/admin.js"></script>
</body>

</html>
